name: PHP checks

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: curl, mbstring, dom
          tools: composer:v2
      - name: Validate Composer manifest
        run: composer validate --no-check-publish
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Syntax check all PHP files
        run: find src public tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Smoke tests
        run: php tests/smoke.php
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check browser worker syntax
        run: node --check worker/worker.js
